<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Register feedback and asynchronous data are separate paths</title><desc id="desc">In the bounded ordinary mode, feedback selects same-LC register state XOR one at raw LUT input C. The ordinary DATAC selector can still supply the asynchronous load data independently. Arithmetic and unsupported control modes are excluded.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52677d"/></marker></defs>
<rect width="1000" height="460" rx="12" fill="#f7fafc"/><g font-family="Arial,Helvetica,sans-serif" fill="#17324d">
<text x="36" y="42" font-size="26" font-weight="700">Register feedback and asynchronous data are separate paths</text><rect x="36" y="93" width="275" height="74" rx="6" fill="#dfeaf3"/><text x="50" y="120" font-size="17" font-weight="600">Ordinary DATAC selector</text><text x="50" y="144" font-size="14">Retained native source selection</text><path d="M311 130 L403 130" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="403" y="93" width="290" height="74" rx="6" fill="#caeceb"/><text x="417" y="120" font-size="17" font-weight="600">Asynchronous load data</text><text x="417" y="144" font-size="14">Independent of LUT-C feedback</text><rect x="36" y="234" width="275" height="74" rx="6" fill="#caeceb"/><text x="50" y="261" font-size="17" font-weight="600">Same-LC REGOUT</text><text x="50" y="285" font-size="14">Qualified clock / control / state</text><path d="M311 272 L403 272" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="403" y="234" width="180" height="74" rx="6" fill="#fff0ce"/><text x="417" y="261" font-size="17" font-weight="600">XOR 1</text><text x="417" y="285" font-size="14">Raw LUT-C polarity</text><path d="M583 272 L630 272" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="630" y="234" width="334" height="74" rx="6" fill="#caeceb"/><text x="644" y="261" font-size="17" font-weight="600">LUT input C → LUT result</text><text x="644" y="285" font-size="14">Feedback-enabled ordinary mode</text><path d="M800 308 L800 362 L170 362 L170 310" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="420" y="388" font-size="15">Clocked register D path; feedback is a state dependency</text><text x="36" y="433" font-size="16">Unknown clock or register controls keep a named REGOUT interface. Carry/arithmetic mode is excluded.</text></g></svg>
