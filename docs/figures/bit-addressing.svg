<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Four coordinate spaces: keep the transforms explicit</title><desc id="desc">File byte offsets, CFM payload bits, native addresses and logical LUT minterms are distinct. Bit n uses byte n div 8 and bit n mod 8. Serializer XOR and LUT interpretation are separate transforms.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52677d"/></marker></defs>
<rect width="1000" height="460" rx="12" fill="#f7fafc"/><g font-family="Arial,Helvetica,sans-serif" fill="#17324d">
<text x="36" y="42" font-size="26" font-weight="700">Four coordinate spaces: keep the transforms explicit</text><rect x="36" y="84" width="430" height="75" rx="6" fill="#dfeaf3"/><text x="50" y="111" font-size="17" font-weight="600">File-byte offset</text><text x="50" y="135" font-size="14">Section payload begins at packet start + 6 + 12</text><rect x="536" y="84" width="428" height="75" rx="6" fill="#caeceb"/><text x="550" y="111" font-size="17" font-weight="600">CFM payload bit n · LSB0</text><text x="550" y="135" font-size="14">Byte = floor(n / 8); bit = n mod 8</text><path d="M466 122 L536 122" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="36" y="213" width="430" height="75" rx="6" fill="#caeceb"/><text x="50" y="240" font-size="17" font-weight="600">Native address / field identity</text><text x="50" y="264" font-size="14">Explicit address → offset and XOR model</text><rect x="536" y="213" width="428" height="75" rx="6" fill="#fff0ce"/><text x="550" y="240" font-size="17" font-weight="600">LUT inputs / logical minterm</text><text x="550" y="264" font-size="14">Separate port, polarity and truth-order transform</text><path d="M750 159 L750 187 L250 187 L250 210" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M466 252 L536 252" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="36" y="336" font-size="18">Raw bit = (payload[n // 8] &gt;&gt; (n % 8)) &amp; 1</text><text x="36" y="368" font-size="18">Normalized storage value = raw bit XOR serializer_xor</text><text x="36" y="406" font-size="15">The functional LUT path consumes raw serialized truth bits with its own native input transform.</text><text x="36" y="434" font-size="15">A mapped storage location alone does not establish a net, a legal placement or a physical pin.</text></g></svg>
