<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">From POF bytes to an explicit partial project</title><desc id="desc">Container parsing and model loading produce typed storage fields. Functional reconstruction follows unique route candidates, applies LUT and register/control transforms and retains unknowns as named inputs. Simulation and HDL emission consume the resulting partial model.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52677d"/></marker></defs>
<rect width="1000" height="510" rx="12" fill="#f7fafc"/><g font-family="Arial,Helvetica,sans-serif" fill="#17324d">
<text x="36" y="42" font-size="26" font-weight="700">From POF bytes to an explicit partial project</text><rect x="36" y="86" width="210" height="74" rx="6" fill="#dfeaf3"/><text x="50" y="113" font-size="17" font-weight="600">POF + exact target</text><text x="50" y="137" font-size="14">Bounds · sizes · CRC</text><path d="M246 124 L281 124" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="281" y="86" width="300" height="74" rx="6" fill="#caeceb"/><text x="295" y="113" font-size="17" font-weight="600">Included result models</text><text x="295" y="137" font-size="14">Fields · routes · package joins</text><path d="M581 124 L616 124" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="616" y="86" width="348" height="74" rx="6" fill="#caeceb"/><text x="630" y="113" font-size="17" font-weight="600">Typed storage IR</text><text x="630" y="137" font-size="14">Native values and unresolved patterns</text><path d="M790 160 L790 207" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="36" y="224" width="420" height="80" rx="6" fill="#caeceb"/><text x="50" y="251" font-size="17" font-weight="600">Functional graph</text><text x="50" y="275" font-size="14">LUT cones · DATA/OE · state and controls</text><path d="M616 264 L456 264" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="616" y="224" width="348" height="80" rx="6" fill="#fff0ce"/><text x="630" y="251" font-size="17" font-weight="600">Configuration candidates</text><text x="630" y="275" font-size="14">Unique / zero / multiple / unknown</text><path d="M246 304 L246 348" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="36" y="363" width="420" height="78" rx="6" fill="#dfeaf3"/><text x="50" y="390" font-size="17" font-weight="600">Simulation + HDL / Quartus draft</text><text x="50" y="414" font-size="14">Explicit initial state; class checks</text><rect x="536" y="363" width="428" height="78" rx="6" fill="#fff0ce"/><text x="550" y="390" font-size="17" font-weight="600">Unknown connection → named cut</text><text x="550" y="414" font-size="14">No guessed wiring; cuts remain top-level inputs</text><text x="36" y="485" font-size="16">Closed model paths are conditional reconstruction results. Full-device, startup and timing equality remain open.</text></g></svg>
