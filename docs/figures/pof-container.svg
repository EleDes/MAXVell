<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">POF: container, packets, configuration payload</title><desc id="desc">A 12-byte global header is followed by variable-length packets. Each packet has a 6-byte tag/length header. CFM and UFM use a 12-byte section prefix. CRC is in the final terminator packet.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52677d"/></marker></defs>
<rect width="1000" height="490" rx="12" fill="#f7fafc"/><g font-family="Arial,Helvetica,sans-serif" fill="#17324d">
<text x="36" y="42" font-size="26" font-weight="700">POF: container, packets, configuration payload</text><text x="36" y="78" font-size="15">Global file header · byte offsets</text><rect x="36" y="95" width="290" height="74" rx="6" fill="#caeceb"/><text x="50" y="122" font-size="17" font-weight="600">0…3 · POF + NUL</text><text x="50" y="146" font-size="14">4-byte signature</text><rect x="336" y="95" width="290" height="74" rx="6" fill="#e2e6ec"/><text x="350" y="122" font-size="17" font-weight="600">4…7 · opaque word</text><text x="350" y="146" font-size="14">Preserved; semantics not asserted</text><rect x="636" y="95" width="328" height="74" rx="6" fill="#caeceb"/><text x="650" y="122" font-size="17" font-weight="600">8…11 · packet count</text><text x="650" y="146" font-size="14">uint32, little endian</text><text x="36" y="209" font-size="15">Repeated packet · starts at byte 12, then follows declared lengths</text><rect x="36" y="225" width="180" height="76" rx="6" fill="#b9dfe4"/><text x="50" y="252" font-size="17" font-weight="600">Tag · 2 bytes</text><text x="50" y="276" font-size="14">uint16 LE</text><rect x="226" y="225" width="238" height="76" rx="6" fill="#b9dfe4"/><text x="240" y="252" font-size="17" font-weight="600">Length · 4 bytes</text><text x="240" y="276" font-size="14">uint32 LE; payload only</text><rect x="474" y="225" width="490" height="76" rx="6" fill="#dfeaf3"/><text x="488" y="252" font-size="17" font-weight="600">Payload · N bytes</text><text x="488" y="276" font-size="14">Next packet starts after 6 + N bytes</text><path d="M719 303 L719 336" stroke="#52677d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="36" y="347" width="340" height="78" rx="6" fill="#fff0ce"/><text x="50" y="374" font-size="17" font-weight="600">CFM 0x11 / UFM 0x18</text><text x="50" y="398" font-size="14">Section prefix · 12 bytes</text><rect x="386" y="347" width="578" height="78" rx="6" fill="#caeceb"/><text x="400" y="374" font-size="17" font-weight="600">Configuration bytes</text><text x="400" y="398" font-size="14">Declared bit count at section-prefix offset +6</text><text x="36" y="464" font-size="16">Final packet 0x08: CRC-16/X-25 · 2 bytes LE · a zero value disables the CRC check</text></g></svg>
